[project]
name = "cmca"
version = "0.2.0"
description = "Constitutional midtraining in an organisation of language-model agents (paper code and data)"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Artificial Societies" }]
dependencies = [
  "httpx>=0.28",
  "httpx2",
  "openai>=3.14.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.60.0"]  # the Gemini 3.1 Pro judges, on Vertex AI
serve = ["modal"]                 # serving, training and the run driver on Modal

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmca"]

[dependency-groups]
dev = [
  "ruff",
  "ty",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["A", "ANN", "B", "C4", "E", "F", "I", "PLC2701", "PLE", "PTH", "SIM", "SLF", "UP", "W"]
ignore = [
  "ANN401",  # Any is used for raw JSON records
  "E501",    # the formatter owns line length; prompt and rubric strings stay verbatim
]

[tool.ty.src]
include = ["cmca"]

[tool.ty.environment]
python = ".venv"
python-version = "3.13"
